<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Arial, Helvetica, sans-serif">
  <!-- Layout guide for parchment.png (art/poster/README.md). Not shipped; for drawing over and for a Discord crop test. -->
  <rect width="1500" height="1000" fill="#e9d8b4"/>

  <!-- Edge band: torn/burnt edges go here; may be transparent -->
  <rect x="0" y="0" width="1500" height="1000" fill="none" stroke="#8b5a2b" stroke-width="120" opacity="0.35"/>
  <text x="750" y="40" font-size="24" fill="#5a3a1a" text-anchor="middle">EDGE (0–60 px): torn or burnt edges, transparency OK</text>

  <!-- Header -->
  <rect x="60" y="60" width="1380" height="200" fill="#c9a66b" opacity="0.6"/>
  <text x="750" y="150" font-size="56" font-weight="bold" fill="#3b2410" text-anchor="middle">HEADER (your art)</text>
  <text x="750" y="205" font-size="26" fill="#3b2410" text-anchor="middle">e.g. painted "WANTED", guild crest, skull. y 60–260</text>

  <!-- Name -->
  <rect x="120" y="280" width="1260" height="120" fill="#ffffff" opacity="0.35" stroke="#3b2410" stroke-dasharray="10 8" stroke-width="3"/>
  <text x="750" y="360" font-size="60" font-weight="bold" fill="#1f1308" text-anchor="middle">TARGET NAME</text>

  <!-- Details -->
  <rect x="120" y="420" width="860" height="320" fill="#ffffff" opacity="0.35" stroke="#3b2410" stroke-dasharray="10 8" stroke-width="3"/>
  <text x="150" y="480" font-size="34" fill="#1f1308">Night Elf Monk · Level 57 · Alliance</text>
  <text x="150" y="590" font-size="80" font-weight="bold" fill="#1f1308">REWARD 500g</text>
  <text x="150" y="650" font-size="30" fill="#1f1308">Paid by Slac Jaw (honor system)</text>
  <text x="150" y="710" font-size="30" fill="#1f1308">Last marked: Stranglethorn Vale</text>

  <!-- Stamp -->
  <rect x="1000" y="420" width="380" height="320" fill="#a02020" opacity="0.15" stroke="#a02020" stroke-dasharray="10 8" stroke-width="3"/>
  <text x="1190" y="570" font-size="40" font-weight="bold" fill="#a02020" text-anchor="middle">STAMP</text>
  <text x="1190" y="615" font-size="24" fill="#a02020" text-anchor="middle">OPEN / CLAIMED / PAID</text>
  <text x="1190" y="645" font-size="24" fill="#a02020" text-anchor="middle">(drawn by the bot)</text>

  <!-- Footer -->
  <rect x="120" y="760" width="1260" height="160" fill="#ffffff" opacity="0.35" stroke="#3b2410" stroke-dasharray="10 8" stroke-width="3"/>
  <text x="150" y="830" font-size="34" fill="#1f1308">Bounty #12 · Expires Dec 4</text>
  <text x="150" y="885" font-size="28" fill="#1f1308">Board K7QF</text>
  <text x="1350" y="885" font-size="22" fill="#5a3a1a" text-anchor="end">keep y 280–920 plain and light: the bot writes text here</text>

  <!-- Possible Discord crops -->
  <rect x="0" y="78" width="1500" height="844" fill="none" stroke="#0066cc" stroke-width="4" stroke-dasharray="24 12"/>
  <text x="1490" y="104" font-size="22" fill="#0066cc" text-anchor="end">16:9 crop</text>
  <rect x="83" y="0" width="1334" height="1000" fill="none" stroke="#009944" stroke-width="4" stroke-dasharray="24 12"/>
  <text x="95" y="990" font-size="22" fill="#009944">4:3 crop</text>
</svg>
