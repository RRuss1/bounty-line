name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  addon:
    name: Addon (luacheck + codec vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.1, LuaJIT and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 luajit luarocks
          sudo luarocks install luacheck
      - run: luacheck addon
      # WoW runs Lua 5.1; test on both stock 5.1 and LuaJIT.
      - run: lua5.1 addon/tests/run.lua
      - run: luajit addon/tests/run.lua
      - run: lua5.1 addon/tests/logic.lua
      - run: luajit addon/tests/logic.lua

  worker:
    name: Worker (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Relay program tests
        working-directory: relay
        run: npm ci && npm test
